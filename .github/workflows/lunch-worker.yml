name: Deploy hot lunch order service

# Manual only. Installs or updates the Cloudflare Worker in worker/ (see worker/README.md).
# Needs these repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET, LUNCH_SETUP_KEY. Optional: MONDAY_TOKEN (copies tour sign-ups,
# info requests and transcript requests to Monday.com boards; the last step makes the boards).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunch-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      LUNCH_SETUP_KEY: ${{ secrets.LUNCH_SETUP_KEY }}
      MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
      WRANGLER: npx --yes wrangler@3.114.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test test/worker.test.mjs
      - name: Find or create the KV namespace
        run: |
          id=$($WRANGLER kv namespace list | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s.slice(s.indexOf("[")));
              const n=j.find(x=>x.title==="ibaclinton-lunch-LUNCH_KV"); console.log(n?n.id:"");});')
          if [ -z "$id" ]; then
            id=$($WRANGLER kv namespace create LUNCH_KV | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          test -n "$id"
          sed -i "s/REPLACED_BY_WORKFLOW/$id/" wrangler.toml
      - name: Deploy
        run: |
          $WRANGLER deploy --var "TENANT_ID:$MS_TENANT_ID" --var "CLIENT_ID:$MS_CLIENT_ID" | tee deploy.log
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 > url.txt
          echo "Order service address: $(cat url.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set secrets
        run: |
          printf '%s' "$MS_CLIENT_SECRET" | $WRANGLER secret put CLIENT_SECRET
          printf '%s' "$LUNCH_SETUP_KEY" | $WRANGLER secret put SETUP_KEY
          if [ -n "$MONDAY_TOKEN" ]; then printf '%s' "$MONDAY_TOKEN" | $WRANGLER secret put MONDAY_TOKEN; fi
      - name: Check it answers
        run: curl -fsS "$(cat url.txt)/health"
      - name: Make sure the workbook has its Teachers and Homerooms tabs
        # Adds them only if missing, and fills blank teacher emails from the TEACHER_EMAILS secret
        # ("K3=a@x.org,K4=...,1=...,12=..."); emails typed in the tab win. Prints counts only.
        # With MONDAY_TOKEN it also makes the Monday.com boards and columns that are missing (prints board ids).
        env:
          TEACHER_EMAILS: ${{ secrets.TEACHER_EMAILS }}
        run: |
          body=$(jq -nc --arg t "$TEACHER_EMAILS" '{action:"setup",teacher_emails:$t}')
          curl -sS -X POST "$(cat url.txt)/admin" -H "X-Setup-Key: $LUNCH_SETUP_KEY" \
            -H "Content-Type: application/json" -d "$body" || true
          echo
