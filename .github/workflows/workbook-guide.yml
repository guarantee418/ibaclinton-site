name: Office workbook layout

# Manual only. "inspect" prints the office workbook's tabs, tables (headings and row counts) and notes;
# no rows, so no family details. "organize" puts the tabs in order, writes the how-to guide and the notes
# on each tab, fixes the Kitchen week box and removes empty table rows (src/guide.js); it never changes a
# table's columns or headings, or any row with something in it. "check-gradelink" prints what the Gradelink
# billing tab shows for a week (students, lunches, charges; no names), putting its week box back afterwards.
# "reset-gradelink-week" puts that week box back to its formula (this week; the coming week from Friday on).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [inspect, organize, check-gradelink, reset-gradelink-week]
        default: inspect
      week:
        description: "check-gradelink only: Monday to show for a moment (YYYY-MM-DD), or blank for the box as it is"
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      LUNCH_SETUP_KEY: ${{ secrets.LUNCH_SETUP_KEY }}
      ACTION: ${{ inputs.action }}
      WEEK: ${{ inputs.week }}
    steps:
      - name: Run
        run: |
          post() { curl -fsS -X POST "https://ibaclinton-lunch.guarantee418.workers.dev/admin" \
            -H "X-Setup-Key: $LUNCH_SETUP_KEY" -H "Content-Type: application/json" -d "$1" | jq -c .; }
          if [ "$ACTION" = check-gradelink ]; then
            # What the Gradelink billing tab shows for one week: counts and totals only, no names.
            post "$(jq -nc --arg w "$WEEK" '{action:"gradelink",week:$w}')"
          elif [ "$ACTION" = reset-gradelink-week ]; then
            # Puts the Gradelink tab's yellow box back to its formula, then shows what the tab shows (no names).
            post '{"action":"gradelink","reset":true}'
          elif [ "$ACTION" = organize ]; then
            # One step per request (src/guide.js STEPS), so each stays under Cloudflare's per-request limit.
            for step in order guide headings notes notes2 kitchen rows; do post "$(jq -nc --arg s "$step" '{action:"organize",step:$s}')"; done
          else
            # A few tabs per request (src/guide.js INSPECT_TABS), so each stays under Cloudflare's per-request limit.
            part=1; parts=1
            while [ "$part" -le "$parts" ]; do
              out=$(curl -fsS -X POST "https://ibaclinton-lunch.guarantee418.workers.dev/admin" \
                -H "X-Setup-Key: $LUNCH_SETUP_KEY" -H "Content-Type: application/json" -d "{\"action\":\"inspect\",\"part\":$part}")
              echo "$out" | jq .sheets
              parts=$(echo "$out" | jq .parts); part=$((part + 1))
            done
          fi
