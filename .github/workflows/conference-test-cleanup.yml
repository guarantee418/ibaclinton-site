name: Delete a TEST booking, lunch order or tour sign-up

# Manual only. Removes a TEST row from the office workbook by its number: a response to a form the office added
# (its own tab, only if its Name starts with "TEST"; a tab named "TEST..." goes too once it is empty), an absence report (Absences tab,
# only if its Student starts with "TEST"), a Feedback for Administration
# response (Feedback tab, only if its Name starts with "TEST"), a Request Info inquiry
# (Inquiries tab, only if its Student starts with "TEST"), a transcript request
# (Transcripts tab, only if its Student starts with "TEST"), a tour sign-up (Tours tab,
# only if its Parent starts with "TEST"), a conference booking
# (Conferences tab, only if its Student starts with "TEST") or a whole lunch order (Orders tab, only if
# each of its rows has a Student or Parent starting with "TEST"). Real bookings and orders can't be removed.
# A TEST tour sign-up, transcript request or info request is also removed from its Monday.com board.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to delete"
        type: choice
        options: [conference booking, lunch order, tour sign-up, transcript request, info request, feedback, absence report, form response]
        default: conference booking
      id:
        description: "Its number (5 letters/digits, e.g. MBG7S)"
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      LUNCH_SETUP_KEY: ${{ secrets.LUNCH_SETUP_KEY }}
      KIND: ${{ inputs.kind }}
      ID: ${{ inputs.id }}
    steps:
      - name: Delete
        run: |
          action=delete_test_booking; [ "$KIND" = "lunch order" ] && action=delete_test_order
          [ "$KIND" = "tour sign-up" ] && action=delete_test_signup
          [ "$KIND" = "transcript request" ] && action=delete_test_transcript
          [ "$KIND" = "info request" ] && action=delete_test_inquiry
          [ "$KIND" = "feedback" ] && action=delete_test_feedback
          [ "$KIND" = "absence report" ] && action=delete_test_absence
          [ "$KIND" = "form response" ] && action=delete_test_form
          body=$(jq -nc --arg a "$action" --arg id "$ID" '{action:$a,id:$id}')
          curl -fsS -X POST "https://ibaclinton-lunch.guarantee418.workers.dev/admin" \
            -H "X-Setup-Key: $LUNCH_SETUP_KEY" -H "Content-Type: application/json" -d "$body"
          echo
