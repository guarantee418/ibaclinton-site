name: Publish to GitHub Pages

# Runs by itself only when the school office saves a change in the online editor
# (lunch menu and The Kings Corner page: content/ and uploaded PDFs in site/files/).
# Everything else is published by hand from the Actions tab when Garrett approves.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site/files/**"

permissions:
  contents: write  # to commit the built lunch menu (last step)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep the published lunch menu and conference schedule in git
        # The order service (worker/) reads site/lunch/menu.json, site/conferences/schedule.json
        # and site/tours/schedule.json
        # from GitHub, not through the domain.
        run: |
          git diff --quiet -- site/lunch/menu.json site/conferences/schedule.json site/tours/schedule.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/lunch/menu.json site/conferences/schedule.json site/tours/schedule.json
          git commit -m "Published lunch menu / conference schedule / tours (automatic)"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 5; done
          exit 1
