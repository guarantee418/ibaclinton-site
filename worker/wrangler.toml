# Hot lunch order service. Deployed by .github/workflows/lunch-worker.yml (manual run).
# Secrets (set by the workflow from GitHub secrets, never in this file):
#   CLIENT_SECRET  Microsoft Entra app client secret
#   SETUP_KEY      random value that protects the one-time /connect sign-in link
name = "ibaclinton-lunch"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Homeroom lunch lists, Mondays 7:00 AM Eastern (11:00 UTC in summer time, 12:00 in winter;
# the Worker sends only on the run that falls at 7 AM Eastern). The day is spelled MON on purpose:
# Cloudflare counts 1 as Sunday, so "* * 1" ran on Sundays and nothing was sent (10/26/2026).
[triggers]
crons = ["0 11 * * MON", "0 12 * * MON"]

# KV namespace for Microsoft's sign-in token and short-lived values. The workflow fills in the id.
[[kv_namespaces]]
binding = "LUNCH_KV"
id = "REPLACED_BY_WORKFLOW"

[vars]
# The published menu, read from GitHub (the Pages workflow commits it after each publish), because
# fetching it through ibaclinton.com from Cloudflare failed with 526 on 2026-10-16.
MENU_URL = "https://raw.githubusercontent.com/guarantee418/ibaclinton-site/main/site/lunch/menu.json"
# https only: since 2026-10-17 Cloudflare (proxy in front of GitHub Pages) sends every http visit to https.
ALLOWED_ORIGINS = "https://guarantee418.github.io,https://ibaclinton.com,https://www.ibaclinton.com"
MAILBOX = "ibs@ibaclinton.com"
REPLY_TO = "ibs@ibcministries.org"
SIGNATURE = "\nMrs. Napierala\nIBA Office and Cafeteria"  # \n = new line (the first one leaves a blank line after "Gratefully,")
WORKBOOK_PATH = "IBA Portal Forms.xlsx"
TABLE = "Orders"
# The published parent-teacher conference schedule, also read from GitHub (same reason).
CONF_URL = "https://raw.githubusercontent.com/guarantee418/ibaclinton-site/main/site/conferences/schedule.json"
# The published school tours (same reason), and who hears about each tour sign-up.
TOUR_URL = "https://raw.githubusercontent.com/guarantee418/ibaclinton-site/main/site/tours/schedule.json"
TOUR_NOTIFY = "iba@ibcministries.org"
HOMEROOM_CC = "ibs@ibcministries.org"  # Cc on the Monday homeroom lunch lists
# Transcript requests (src/transcripts.js): who hears about each one, the fees in dollars (0 = no fee) and
# the PaySimple payment page alumni pay at (empty until the school has one: the office collects the fee).
TRANSCRIPT_NOTIFY = "iba@ibcministries.org"
TRANSCRIPT_FEE_ALUMNI = "10"
TRANSCRIPT_FEE_STUDENT = "10"
TRANSCRIPT_PAY_URL = ""
# Who hears about each Request Info inquiry (src/inquiries.js); comma-separated.
INQUIRY_NOTIFY = "iba@ibcministries.org,ggreene@ibcministries.org"
# Who hears about each absence report (src/absences.js); the homeroom teacher is Cc'd from the Teachers tab.
ABSENCE_NOTIFY = "iba@ibcministries.org"
# Also Cc'd on every absence report (comma-separated).
ABSENCE_CC = "ibs@ibcministries.org"
# Forms the office adds to The Kings Corner (src/forms.js): the published form list (read from GitHub, like the
# menu) and who hears about each response (comma-separated); the person always gets a confirmation.
FORMS_URL = "https://raw.githubusercontent.com/guarantee418/ibaclinton-site/main/site/forms/forms.json"
FORM_NOTIFY = "iba@ibcministries.org,ibs@ibcministries.org"
# The hidden Teacher Portal (src/teachers.js): the PRIVATE repo with its content and files (read with the
# TEACHER_REPO_TOKEN secret) and who hears about each Teacher Portal form response (comma-separated).
TEACHER_REPO = "guarantee418/ibaclinton-teachers"
TEACHER_FORM_NOTIFY = "iba@ibcministries.org,ibs@ibcministries.org"
# Monday.com copies of tour sign-ups, info requests and transcript requests (src/monday.js; needs the
# MONDAY_TOKEN secret). "private" boards are seen only by the token's owner until shared; "public" = everyone
# on the Monday account. Only used when the boards are first made.
MONDAY_BOARD_KIND = "private"
# The boards of forms with "Also add to monday.com" (Teacher Portal forms): public, seen by everyone on the Monday
# account (Garrett, 2026-10-22).
FORM_BOARD_KIND = "public"
# Monday users added to each board (by their Monday login email; someone not on the Monday account is skipped).
MONDAY_SHARE = "iba@ibcministries.org,ibs@ibcministries.org,ibs@ibaclinton.com"
# Filled in by the workflow from GitHub secrets (not secret, but kept out of this public repo):
TENANT_ID = ""
CLIENT_ID = ""
