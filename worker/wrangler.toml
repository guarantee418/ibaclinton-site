# Hot lunch order service. Deployed by .github/workflows/lunch-worker.yml (manual run).
# Secrets (set by the workflow from GitHub secrets, never in this file):
#   CLIENT_SECRET  Microsoft Entra app client secret
#   SETUP_KEY      random value that protects the one-time /connect sign-in link
name = "ibaclinton-lunch"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Homeroom lunch lists, Mondays 7:00 AM Eastern (11:00 UTC in summer time, 12:00 in winter;
# the Worker sends only on the run that falls at 7 AM Eastern).
[triggers]
crons = ["0 11 * * 1", "0 12 * * 1"]

# KV namespace for Microsoft's sign-in token and short-lived values. The workflow fills in the id.
[[kv_namespaces]]
binding = "LUNCH_KV"
id = "REPLACED_BY_WORKFLOW"

[vars]
# The published menu, read from GitHub (the Pages workflow commits it after each publish), because
# fetching it through ibaclinton.com from Cloudflare failed with 526 on 2026-10-16.
MENU_URL = "https://raw.githubusercontent.com/guarantee418/ibaclinton-site/main/site/lunch/menu.json"
# https only: since 2026-10-17 Cloudflare (proxy in front of GitHub Pages) sends every http visit to https.
ALLOWED_ORIGINS = "https://guarantee418.github.io,https://ibaclinton.com,https://www.ibaclinton.com"
MAILBOX = "ibs@ibaclinton.com"
REPLY_TO = "ibs@ibcministries.org"
SIGNATURE = "Mrs. Napierala\nIndependent Baptist Academy"  # \n = new line
WORKBOOK_PATH = "IBA Portal Forms.xlsx"
TABLE = "Orders"
# The published parent-teacher conference schedule, also read from GitHub (same reason).
CONF_URL = "https://raw.githubusercontent.com/guarantee418/ibaclinton-site/main/site/conferences/schedule.json"
# The published school tours (same reason), and who hears about each tour sign-up.
TOUR_URL = "https://raw.githubusercontent.com/guarantee418/ibaclinton-site/main/site/tours/schedule.json"
TOUR_NOTIFY = "iba@ibcministries.org"
HOMEROOM_CC = "ibs@ibcministries.org"  # Cc on the Monday homeroom lunch lists
# Transcript requests (src/transcripts.js): who hears about each one, the fees in dollars (0 = no fee) and
# the PaySimple payment page alumni pay at (empty until the school has one: the office collects the fee).
TRANSCRIPT_NOTIFY = "ggreene@ibcministries.org"
TRANSCRIPT_FEE_ALUMNI = "10"
TRANSCRIPT_FEE_STUDENT = "10"
TRANSCRIPT_PAY_URL = ""
# Filled in by the workflow from GitHub secrets (not secret, but kept out of this public repo):
TENANT_ID = ""
CLIENT_ID = ""
