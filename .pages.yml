# Online editor for the school office (Pages CMS, app.pagescms.org).
# Secretaries are invited by email as collaborators; they can edit only what is listed here.
# Saving commits to main, and the "Publish to GitHub Pages" workflow publishes it automatically.
# Changing this file (what the office can edit) needs Garrett's approval.

media:
  input: site/files
  output: /files
  categories: [document, image]
  rename: safe

content:
  - name: lunch
    label: Hot Lunch
    type: file
    path: content/lunch.json
    format: json
    fields:
      - name: weeks
        label: Weeks
        description: List as many weeks as you like; each shows on the website as its own card with its dates, and weeks that are over drop off by themselves. Parents can order online for any week with a typed menu until its deadline.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Week of {week_start}"
        fields:
          - name: week_start
            label: Week starts (Monday)
            type: date
            required: true
            description: The Monday of the lunch week (a Saturday or Sunday counts as the Monday after it).
            options:
              format: yyyy-MM-dd
          - name: graphic
            label: Menu graphic (optional)
            type: file
            description: A picture of the week's menu (JPG or PNG, for example from Canva). Shown on the week's card; tap to see it full size. To take orders online, also type the meals below.
            options:
              extensions: [jpg, jpeg, png, gif, webp]
          - name: menu
            label: Menu
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{day}: {meal}"
            fields:
              - name: day
                label: Day
                type: select
                options:
                  values: [Monday, Tuesday, Wednesday, Thursday, Friday]
              - name: meal
                label: Meal
                type: string
                description: Leave blank for a day with no hot lunch. With choices below, this is the day's title, for example Pizza (or leave it blank to list the choices).
              - name: options
                label: Choices (optional)
                type: string
                list:
                  max: 5
                description: Only for a day with more than one option, for example Cheese pizza and Pepperoni pizza. Parents then pick one per student, and the Kitchen tab counts each choice. Leave empty for one meal.
          - name: no_school
            label: No school on
            type: select
            description: Pick any days there is no school this week, for example Friday for a day off. Those days show "No school" on the website, can't be ordered, and the week's dates shorten to match (Week of October 26 – 29). When a Friday is marked No school, the next week's usual deadline moves to Thursday by itself.
            options:
              multiple: true
              values: [Monday, Tuesday, Wednesday, Thursday, Friday]
          - name: order_deadline
            label: Order deadline (only if different)
            type: date
            default: ""
            description: Leave blank for the usual deadline, 9:00 AM on the Friday before the lunch week. Fill in only for a different date or time (Eastern).
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm
          - name: note
            label: Note
            type: text
            description: Optional line for this week, for example a half day or a schedule change.
      - name: price_regular
        label: Price per lunch (K5 to 12th)
        type: number
        options:
          min: 0
      - name: price_preschool
        label: Price per lunch (preschool)
        type: number
        options:
          min: 0
      - name: price_staff
        label: Price per lunch (staff)
        type: number
        description: Staff order on the same form by choosing "Staff" under Grade; this is their price per lunch. Children of staff families (Staff Families tab of the office workbook) pay it too.
        options:
          min: 0
      - name: order_form_url
        label: Backup order form link
        type: string
        description: Only used if online ordering is turned off. A Microsoft Forms link (https://forms.cloud.microsoft/r/...) is shown right on the page.
        pattern:
          regex: "^(https://.*)?$"
          message: "Paste the full link, starting with https://"

  - name: tours
    label: School Tours
    type: file
    path: content/tours.json
    format: json
    fields:
      - name: spots
        label: Families per tour (usual)
        type: number
        description: A tour shows as full once this many families have signed up. Each tour can set its own number below.
        options:
          min: 1
      - name: note
        label: Note
        type: text
        description: Optional line shown above the tours on the Book a Tour page.
      - name: tours
        label: Tours
        description: Families sign up at ibaclinton.com/tour/. Past tours drop off the page by themselves. Sign-ups are on the Tours tab of the office workbook.
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{date} {time}"
        fields:
          - name: date
            label: Date
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: time
            label: Time
            type: string
            required: true
            description: For example 1:00 PM
          - name: spots
            label: Families (only if different)
            type: number
            description: Leave blank for the usual number above.
            options:
              min: 1
          - name: signup_deadline
            label: Sign-up deadline (only if different)
            type: date
            description: Leave blank for the usual, 3:00 PM on the school day before. Eastern time.
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm
          - name: note
            label: Note
            type: string
            description: Optional, for example "Preschool families welcome"

  - name: conferences
    label: Parent-Teacher Conferences
    type: file
    path: content/conferences.json
    format: json
    fields:
      - name: date
        label: Conference day
        type: date
        default: ""
        description: Leave blank to close sign-ups. The page is ibaclinton.com/conferences/
        options:
          format: yyyy-MM-dd
      - name: start
        label: First conference starts
        type: string
        description: For example 9:00 AM
      - name: end
        label: Conferences end by
        type: string
        description: For example 1:00 PM. The last conference ends at or before this time.
      - name: minutes
        label: Minutes per conference
        type: number
        options:
          min: 5
      - name: break_minutes
        label: Break between conferences (minutes)
        type: number
        options:
          min: 0
      - name: booking_deadline
        label: Sign-up deadline (only if different)
        type: date
        default: ""
        description: Leave blank for the usual deadline, 3:00 PM on the school day before. Fill in only for a different date or time (Eastern).
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: note
        label: Note
        type: text
        description: Optional extra line for parents, for example where to check in.
      - name: teachers
        label: Teachers
        description: Each teacher gets their own sign-up panel. Type teacher names the same way as on the Teachers tab of the office workbook, so each teacher gets an email for each booking.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}: {subject}"
        fields:
          - name: name
            label: Teacher
            type: string
            required: true
          - name: subject
            label: Class or subject
            type: string
            description: For example 3rd Grade, or Art
          - name: members
            label: Teachers in this panel (only for a shared panel)
            type: string
            description: For a panel where several teachers meet each family together, list them with commas, for example Mr. Napierala, Mr. Damm, Mr. Greene. Each gets the booking email. Leave blank for one teacher.

  - name: parents
    label: The Kings Corner (parents page)
    type: file
    path: content/parents.json
    format: json
    fields:
      - name: hero
        label: Top of the page (purple banner)
        type: object
        fields:
          - name: script
            label: Small line above the title
            type: string
            description: For example "Welcome to". Leave blank to hide it.
          - name: title
            label: Title
            type: string
            required: true
          - name: text
            label: Text under the title
            type: text
          - name: button_text
            label: Button text
            type: string
            description: Leave blank to hide the button.
          - name: button_url
            label: Button link
            type: string
            pattern:
              regex: "^(https://.*)?$"
              message: "Paste the full link, starting with https://"
      - name: tiles_script
        label: Small line above the tiles
        type: string
        description: For example "Inside the Corner". Leave blank to hide it.
      - name: tiles_heading
        label: Heading above the tiles
        type: string
      - name: tiles
        label: Tiles
        description: The cards on the page, in this order (drag to reorder). Each one opens a section (below) in a pop-up with back buttons. A section that no tile opens gets a plain tile at the end.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: One-line description
            type: string
          - name: section
            label: Goes to section
            type: string
            required: true
            description: The section's "Page link name" (shown at the bottom of each section below), for example hot-lunch, calendars or gradelink. A full https:// link also works. A tile whose section doesn't exist is not shown.
          - name: tag
            label: Small tag (optional)
            type: string
            description: For example "Login". Leave blank for none.
      - name: sections
        label: Sections
        description: What each tile opens. A section shows in a pop-up when its tile is clicked, not on the page itself.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Heading
            type: string
            required: true
          - name: text
            label: Text
            type: rich-text
          - name: links
            label: Links and PDFs
            type: object
            list: true
            fields:
              - name: title
                label: Link text
                type: string
                required: true
              - name: file
                label: PDF
                type: file
                description: Upload a PDF, or use the web link below instead.
                options:
                  extensions: [pdf]
              - name: url
                label: Web link (instead of a PDF)
                type: string
                pattern:
                  regex: "^(https://.*)?$"
                  message: "Paste the full link, starting with https://"
          - name: show_lunch
            label: Show the hot lunch menu and order form here
            type: boolean
            description: Turn on for the Hot Lunch section only. The menu itself is edited under Hot Lunch.
          - name: show_absence
            label: Show the Report Student Absence form here
            type: boolean
            description: Turn on for the Report Student Absence section only. Reports go to the Absences tab of the office workbook.
          - name: show_feedback
            label: Show the Feedback for Administration form here
            type: boolean
            description: Turn on for the Feedback for Administration section only. Responses go to the Feedback tab of the office workbook.
          - name: anchor
            label: Page link name (advanced)
            type: string
            description: Used in links like ibaclinton.com/parents/#hot-lunch (opens that pop-up) and by the tiles ("Goes to section"). Leave as is; for a new section type a short name like field-trips, or leave blank.
