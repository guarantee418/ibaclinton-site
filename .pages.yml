# Online editor for the school office (Pages CMS, app.pagescms.org).
# Secretaries are invited by email as collaborators; they can edit only what is listed here.
# Saving commits to main, and the "Publish to GitHub Pages" workflow publishes it automatically.
# Changing this file (what the office can edit) needs Garrett's approval.

media:
  input: site/files
  output: /files
  categories: [document]
  rename: safe

content:
  - name: lunch
    label: Hot Lunch
    type: file
    path: content/lunch.json
    format: json
    fields:
      - name: week_of
        label: Week of
        type: string
        description: For example "October 19 – 23". Leave the meals blank to show the general hot lunch text instead.
      - name: menu
        label: Menu
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{day}: {meal}"
        fields:
          - name: day
            label: Day
            type: string
          - name: meal
            label: Meal
            type: string
      - name: price
        label: Price
        type: string
        description: Shown under the menu. Currently "Lunches are $8.00 ($5.00 for preschool)."
      - name: order_by
        label: Order by
        type: string
        description: Optional deadline shown above the button, for example "Thursday, October 15".
      - name: order_form_url
        label: Order form link
        type: string
        description: The Microsoft Forms link for the order form, the same one that is texted to families (for example https://forms.cloud.microsoft/r/...). Leave blank to hide the button.
        pattern:
          regex: "^(https://.*)?$"
          message: "Paste the full link, starting with https://"
      - name: note
        label: Note
        type: text
        description: Optional extra line, for example a schedule change.

  - name: documents
    label: Parent Portal documents
    type: file
    path: content/documents.json
    format: json
    fields:
      - name: calendars
        label: Calendars
        type: object
        list: true
        fields:
          - name: title
            label: Link text
            type: string
            required: true
          - name: file
            label: PDF
            type: file
            description: Upload a PDF, or use the web link below instead.
            options:
              extensions: [pdf]
          - name: url
            label: Web link (instead of a PDF)
            type: string
            pattern:
              regex: "^(https://.*)?$"
              message: "Paste the full link, starting with https://"
