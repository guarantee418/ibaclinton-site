# Online editor for the school office (Pages CMS, app.pagescms.org).
# Secretaries are invited by email as collaborators; they can edit only what is listed here.
# Saving commits to main, and the "Publish to GitHub Pages" workflow publishes it automatically.
# Changing this file (what the office can edit) needs Garrett's approval.

media:
  input: site/files
  output: /files
  categories: [document]
  rename: safe

content:
  - name: lunch
    label: Hot Lunch
    type: file
    path: content/lunch.json
    format: json
    fields:
      - name: week_start
        label: Week starts (Monday)
        type: date
        default: ""
        description: The Monday of the lunch week. Leave the meals blank to show the general hot lunch text instead.
        options:
          format: yyyy-MM-dd
      - name: order_deadline
        label: Order deadline
        type: date
        default: ""
        description: Online ordering closes at this date and time (Eastern). After that, parents are told to call the office.
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: menu
        label: Menu
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{day}: {meal}"
        fields:
          - name: day
            label: Day
            type: select
            options:
              values: [Monday, Tuesday, Wednesday, Thursday, Friday]
          - name: meal
            label: Meal
            type: string
            description: Leave blank for a day with no hot lunch.
      - name: price_regular
        label: Price per lunch (K5 to 12th)
        type: number
        options:
          min: 0
      - name: price_preschool
        label: Price per lunch (preschool)
        type: number
        options:
          min: 0
      - name: note
        label: Note
        type: text
        description: Optional extra line, for example a schedule change.
      - name: order_form_url
        label: Backup order form link
        type: string
        description: Only used if online ordering is turned off. A Microsoft Forms link (https://forms.cloud.microsoft/r/...) is shown right on the page.
        pattern:
          regex: "^(https://.*)?$"
          message: "Paste the full link, starting with https://"

  - name: documents
    label: Parent Portal documents
    type: file
    path: content/documents.json
    format: json
    fields:
      - name: calendars
        label: Calendars
        type: object
        list: true
        fields:
          - name: title
            label: Link text
            type: string
            required: true
          - name: file
            label: PDF
            type: file
            description: Upload a PDF, or use the web link below instead.
            options:
              extensions: [pdf]
          - name: url
            label: Web link (instead of a PDF)
            type: string
            pattern:
              regex: "^(https://.*)?$"
              message: "Paste the full link, starting with https://"
