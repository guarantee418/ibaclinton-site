# Online editor for the school office (Pages CMS, app.pagescms.org).
# Secretaries are invited by email as collaborators; they can edit only what is listed here.
# Saving commits to main, and the "Publish to GitHub Pages" workflow publishes it automatically.
# Changing this file (what the office can edit) needs Garrett's approval.

media:
  input: site/files
  output: /files
  categories: [document]
  rename: safe

content:
  - name: lunch
    label: Hot Lunch
    type: file
    path: content/lunch.json
    format: json
    fields:
      - name: week_start
        label: Week starts (Monday)
        type: date
        default: ""
        description: The Monday of the lunch week. Leave the meals blank to show the general hot lunch text instead.
        options:
          format: yyyy-MM-dd
      - name: order_deadline
        label: Order deadline (only if different)
        type: date
        default: ""
        description: Leave blank for the usual deadline, 9:00 AM on the Friday before the lunch week. Fill in only for a different date or time (Eastern), for example when that Friday is a day off.
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: menu
        label: Menu
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{day}: {meal}"
        fields:
          - name: day
            label: Day
            type: select
            options:
              values: [Monday, Tuesday, Wednesday, Thursday, Friday]
          - name: meal
            label: Meal
            type: string
            description: Leave blank for a day with no hot lunch.
      - name: price_regular
        label: Price per lunch (K5 to 12th)
        type: number
        options:
          min: 0
      - name: price_preschool
        label: Price per lunch (preschool)
        type: number
        options:
          min: 0
      - name: note
        label: Note
        type: text
        description: Optional extra line, for example a schedule change.
      - name: order_form_url
        label: Backup order form link
        type: string
        description: Only used if online ordering is turned off. A Microsoft Forms link (https://forms.cloud.microsoft/r/...) is shown right on the page.
        pattern:
          regex: "^(https://.*)?$"
          message: "Paste the full link, starting with https://"

  - name: conferences
    label: Parent-Teacher Conferences
    type: file
    path: content/conferences.json
    format: json
    fields:
      - name: date
        label: Conference day
        type: date
        default: ""
        description: Leave blank to close sign-ups. The page is ibaclinton.com/conferences/
        options:
          format: yyyy-MM-dd
      - name: start
        label: First conference starts
        type: string
        description: For example 9:00 AM
      - name: end
        label: Conferences end by
        type: string
        description: For example 1:00 PM. The last conference ends at or before this time.
      - name: minutes
        label: Minutes per conference
        type: number
        options:
          min: 5
      - name: break_minutes
        label: Break between conferences (minutes)
        type: number
        options:
          min: 0
      - name: booking_deadline
        label: Sign-up deadline (only if different)
        type: date
        default: ""
        description: Leave blank for the usual deadline, 3:00 PM on the school day before. Fill in only for a different date or time (Eastern).
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: note
        label: Note
        type: text
        description: Optional extra line for parents, for example where to check in.
      - name: teachers
        label: Teachers
        description: Each teacher gets their own sign-up panel. Type teacher names the same way as on the Teachers tab of the office workbook, so each teacher gets an email for each booking.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}: {subject}"
        fields:
          - name: name
            label: Teacher
            type: string
            required: true
          - name: subject
            label: Class or subject
            type: string
            description: For example 3rd Grade, or Art
          - name: members
            label: Teachers in this panel (only for a shared panel)
            type: string
            description: For a panel where several teachers meet each family together, list them with commas, for example Mr. Napierala, Mr. Damm, Mr. Greene. Each gets the booking email. Leave blank for one teacher.

  - name: parents
    label: Parent Portal page
    type: file
    path: content/parents.json
    format: json
    fields:
      - name: heading
        label: Welcome heading
        type: string
      - name: intro
        label: Welcome text
        type: text
      - name: sections
        label: Sections
        description: Shown on the page in this order (drag to reorder). The quick links at the top list them A to Z.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Heading
            type: string
            required: true
          - name: menu_label
            label: Quick link name
            type: string
            description: Short name for the quick links at the top, for example "Handbooks". Leave blank to use the heading.
          - name: text
            label: Text
            type: rich-text
          - name: links
            label: Links and PDFs
            type: object
            list: true
            fields:
              - name: title
                label: Link text
                type: string
                required: true
              - name: file
                label: PDF
                type: file
                description: Upload a PDF, or use the web link below instead.
                options:
                  extensions: [pdf]
              - name: url
                label: Web link (instead of a PDF)
                type: string
                pattern:
                  regex: "^(https://.*)?$"
                  message: "Paste the full link, starting with https://"
          - name: show_lunch
            label: Show the hot lunch menu and order form here
            type: boolean
            description: Turn on for the Hot Lunch section only. The menu itself is edited under Hot Lunch.
          - name: anchor
            label: Page link name (advanced)
            type: string
            description: Used in links like ibaclinton.com/parents/#hot-lunch. Leave as is; for a new section leave blank.
